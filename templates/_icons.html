{# Icônes au trait (24×24), dessinées en SVG : nettes à toutes les tailles, sans emoji. #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" aria-hidden="true">

{%- elif name == "printer" -%}

{%- elif name == "prints" -%}

{%- elif name == "pause" -%}

{%- elif name == "stop" -%}

{%- elif name == "light" -%}

{%- elif name == "fullscreen" -%}

{%- elif name == "assistant" -%}

{%- elif name == "send" -%}
  <path d="M4 12l16-8-6 16-3-7z"/>
{%- elif name == "upload" -%}
  <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
