<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1013">
  <title>Connexion — Bambu Control</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/console.css', v=asset_version) }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/BambuLab.png') }}">
</head>
<body>
  <div class="login">
    <div class="surface login-box">
      <h1>Bambu Control</h1>
      <p class="muted">Console de supervision</p>

      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="username">Identifiant</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
